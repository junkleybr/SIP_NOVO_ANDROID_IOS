name: visual2_voz
description: visual2.voz - Aplicativo SIP Mobile da Visual2 Voz para Android e iOS.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # UI / Material 3
  google_fonts: ^6.2.1

  # SIP / WebRTC (sip_ua traz flutter_webrtc como dependencia transitiva)
  sip_ua: ^0.5.7

  # Estado / persistencia
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Permissoes e telefonia
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.5

  # Utilidades
  intl: ^0.18.1
  uuid: ^3.0.7
  package_info_plus: ^8.0.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
