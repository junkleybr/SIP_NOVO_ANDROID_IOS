name: visual2_voz
description: visual2.voz - Aplicativo SIP Mobile da Visual2 Voz para Android e iOS.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / Material 3
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # SIP / WebRTC (Dart puro, multiplataforma Android+iOS)
  sip_ua: ^0.5.7
  
  # Estado / persistência
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Permissões e telefonia
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.5

  # Notificações e chamadas em background
  flutter_local_notifications: ^17.2.1+2
  flutter_callkit_incoming: ^2.0.4+2

  # Áudio
  audioplayers: ^6.0.0

  # Utilidades
  intl: ^0.18.1
  uuid: ^3.0.7
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  flutter_contacts: ^1.1.9+2
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  background_color: "#FF6B00"
  theme_color: "#FF6B00"
